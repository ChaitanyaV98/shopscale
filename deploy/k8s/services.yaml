# The four application services. Only the gateway is meant to be exposed (port-forward or an Ingress).---
apiVersion: apps/v1
kind: Deployment
metadata: { name: gateway }
spec:
  replicas: 2   # two of everything: SKIP LOCKED relays, consumer groups and row locks make that safe
  selector: { matchLabels: { app: gateway } }
  template:
    metadata: { labels: { app: gateway } }
    spec:
      terminationGracePeriodSeconds: 30   # SIGTERM → stop HTTP, stop consuming, flush outbox
      # Kubernetes injects Docker-link-style env vars per Service (e.g. ORDERS_PORT=tcp://10.96.0.12:4001),
      # which collide with our own ORDERS_PORT setting. We use DNS names instead, so turn them off.
      enableServiceLinks: false
      containers:
        - name: gateway
          image: shopscale:dev
          imagePullPolicy: IfNotPresent
          env: [{ name: SERVICE, value: gateway }]
          envFrom: [{ configMapRef: { name: shopscale-config } }, { secretRef: { name: shopscale-db } }]
          ports: [{ containerPort: 4000 }]
          readinessProbe: { httpGet: { path: /health, port: 4000 }, periodSeconds: 5 }
          livenessProbe: { httpGet: { path: /health, port: 4000 }, initialDelaySeconds: 20, periodSeconds: 10 }
          resources: { requests: { cpu: 50m, memory: 96Mi }, limits: { memory: 256Mi } }
---
apiVersion: v1
kind: Service
metadata: { name: gateway }
spec: { selector: { app: gateway }, ports: [{ port: 4000 }] }   # ClusterIP: internal only
