apiVersion: v1
kind: ConfigMap
metadata: { name: shopscale-config }
data:
  KAFKA_BROKERS: redpanda:9092
  REDIS_URL: redis://redis:6379
  ORDERS_URL: http://orders:4001
  INVENTORY_URL: http://inventory:4002
  PAYMENTS_URL: http://payments:4003
  RESERVATION_MODE: locked
---
# Demo credentials. In a real cluster these come from a secret manager (External Secrets, Vault…),
# never from a file in Git.
apiVersion: v1
kind: Secret
metadata: { name: shopscale-db }
type: Opaque
stringData:
  ORDERS_DATABASE_URL: postgres://orders_svc:orders_svc@postgres:5432/orders
  INVENTORY_DATABASE_URL: postgres://inventory_svc:inventory_svc@postgres:5432/inventory
  PAYMENTS_DATABASE_URL: postgres://payments_svc:payments_svc@postgres:5432/payments
