# Infrastructure for local development, tests and the k6 load test.
# Host ports avoid ones taken by other local projects (Postgres 5432–5435, Redis 6379–6380).
services:
  postgres:
    image: postgres:17-alpine
    container_name: shopscale-postgres
    environment:
      POSTGRES_USER: shopscale
      POSTGRES_PASSWORD: shopscale
      POSTGRES_DB: postgres
    command: ["postgres", "-c", "max_connections=300"]
    ports: ["5436:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shopscale"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Kafka-compatible broker, much lighter than Kafka + ZooKeeper on an 8 GB laptop.
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.2.7
    container_name: shopscale-redpanda
    command:
      - redpanda start
      - --mode dev-container
      - --smp 1
      - --memory 1G
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092
    ports: ["19092:19092"]
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true'"]
      interval: 3s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7-alpine
    container_name: shopscale-redis
    command: ["redis-server", "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru"]
    ports: ["6381:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
